<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지원 관리 | 함께가요 용인</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <aside class="sidebar" aria-label="서비스 메뉴">
    <div class="brand"><svg aria-hidden="true"><use href="#panel"/></svg> 함께가요 용인 <span class="notice" aria-label="알림 3개"><svg aria-hidden="true"><use href="#bell"/></svg><b>3</b></span></div>
    <div class="prepare"><strong>＋</strong> 프로그램 신청 준비</div>
    <nav aria-label="주 메뉴">
      <span><svg aria-hidden="true"><use href="#home"/></svg>참여 가능 프로그램</span>
      <span><svg aria-hidden="true"><use href="#search"/></svg>프로그램 탐색</span>
      <a href="./" aria-current="page"><svg aria-hidden="true"><use href="#users"/></svg>지원 관리</a>
      <span><svg aria-hidden="true"><use href="#list"/></svg>신청 현황</span>
      <span><svg aria-hidden="true"><use href="#flag"/></svg>행사 관리</span>
      <span><svg aria-hidden="true"><use href="#map"/></svg>사각지대 지도</span>
    </nav>
    <section class="side-groups" aria-label="참여 그룹">
      <p>참여 그룹</p>
      <div id="group-links"></div>
    </section>
    <div class="profile">
      <span class="avatar">용</span>
      <div><strong>용인 ○○ 주간보호센터</strong><small>담당자 최정원</small></div>
      <svg aria-hidden="true"><use href="#sun"/></svg>
    </div>
  </aside>

  <main>
    <header class="page-header">
      <h1>지원 관리</h1>
      <div class="actions">
        <button id="add-care" class="pill">개별 케어 추가</button>
        <button id="add-group" class="pill primary">공통 지원 그룹 만들기</button>
      </div>
    </header>
    <div class="tabs" aria-label="지원 구분">
      <button id="groups-tab" aria-controls="groups-panel" aria-pressed="true">공통 지원 <span id="group-count"></span></button>
      <button id="care-tab" aria-controls="care-panel" aria-pressed="false">개별 케어 명단 <span id="care-count"></span></button>
    </div>

    <div class="dashboard">
      <section id="groups-panel" aria-labelledby="groups-tab"></section>
      <section id="care-panel" aria-labelledby="care-tab" hidden></section>
      <aside class="overview" aria-label="기관 요약">
        <section class="card summary">
          <h2>기관 전체</h2>
          <p><strong id="total"></strong> 명이 함께 다녀요</p>
          <div id="metrics"></div>
        </section>
        <section class="tip">
          <h2>이름과 진단명은 적지 않아요</h2>
          <p>그룹에는 몇 명이 어떤 지원이 필요한지만 남겨요. 한 사람만 따로 챙길 일은 개별 케어 명단에 별칭으로 적어요.</p>
        </section>
      </aside>
    </div>
  </main>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form">
      <h2 id="editor-title"></h2>
      <div id="editor-fields"></div>
      <div class="actions">
        <button class="pill" type="button" id="cancel">취소</button>
        <button class="pill primary" type="submit">저장</button>
      </div>
    </form>
  </dialog>

  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4"/></symbol>
    <symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
    <symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M2 20v-2a7 7 0 0 1 14 0v2m0-16a3 3 0 0 1 0 6m3 3a6 6 0 0 1 3 5v2"/></symbol>
    <symbol id="list" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/></symbol>
    <symbol id="flag" viewBox="0 0 24 24"><path d="m4 10 14-6v14L4 14zm3 5 2 5h3l-2-4"/></symbol>
    <symbol id="map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zm6-3v15m6-12v15"/></symbol>
    <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
  </svg>
</body>
</html>
